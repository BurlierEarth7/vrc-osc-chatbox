name: Integration Issue
description: Problems involving VRChat, OSC, media players, or desktop integrations
title: "[Integration]: "
labels:
  - integration

body:
  - type: markdown
    attributes:
      value: |
        notice: this template was generated with the assistance of ai, some things may be inaccurate.
        please fill them out to the best of your ability!

  - type: dropdown
    id: integration
    attributes:
      label: Affected Integration"
      options:
        - VRChat OSC
        - PlayerCTL
        - Spotify
        - VLC
        - MPV
        - KDE
        - GNOME
        - PipeWire
        - PulseAudio
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description"
      placeholder: Describe the integration issue.
    validations:
      required: true

  - type: textarea
    id: osc
    attributes:
      label: OSC Connectivity"
      options:
        - label: VRChat OSC is enabled
        - label: OSC messages appear to be sent
        - label: Another OSC tool works correctly

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs"
      render: shell