name: Bug Report
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue.

        Please provide as much detail as possible so the issue can be reproduced.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Briefly describe the issue.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce"
      description: How can this issue be reproduced?
      placeholder: |
        1. Start VRChat
        2. Launch the application
        3. Play media in Spotify
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: The chatbox should update with the current track.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: The application crashes / OSC messages are not sent.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration"
      description: DO NOT SHARE ANY PRIVATE INFORMATION!
      render: toml

  - type: input
    id: version
    attributes:
      label: Application Version"
      placeholder: v0.3.1
    validations:
      required: true

  - type: dropdown
    id: distro
    attributes:
      label: Linux Distribution"
      options:
        - Arch Linux
        - Fedora
        - Ubuntu
        - Debian
        - NixOS
        - openSUSE
        - Other
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel Version"
      placeholder: 6.18.29-1

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output"
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist"
      options:
        - label: I searched existing issues.
          required: true
        - label: I verified the issue still exists on the latest version.
          required: true